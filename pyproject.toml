[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakkeeper"
dynamic = ["version"]
description = "Dependency-free VPN/network leak tester (IP, DNS, WebRTC, QUIC, ECS, kill-switch, split-tunnel, mDNS)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "bootvec" }]
keywords = ["vpn", "leak", "dns", "webrtc", "privacy", "security", "linux", "kill-switch", "quic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/bootvec/leakkeeper"
Repository = "https://github.com/bootvec/leakkeeper"
Issues = "https://github.com/bootvec/leakkeeper/issues"

[project.scripts]
leakkeeper = "leakkeeper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["leakkeeper*"]

[tool.setuptools.dynamic]
version = { attr = "leakkeeper._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # ternary is fine in some branches
    "UP035",   # List/Optional from typing is intentionally used (py3.9)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]  # patch.object(...) one-liners are naturally long
